<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Churn Prediction</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
                min-height: 100vh;
                color: #fff;
                padding: 20px;
            }

            .container {
                max-width: 900px;
                margin: 0 auto;
            }

            /* ── Header ── */
            .header {
                text-align: center;
                padding: 30px 0;
            }

            .header h1 {
                font-size: 2.5rem;
                background: linear-gradient(90deg, #00d2ff, #3a7bd5);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 10px;
            }

            .header p {
                color: #aaa;
                font-size: 1.1rem;
            }

            /* ── Card ── */
            .card {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 16px;
                padding: 30px;
                margin-bottom: 20px;
                backdrop-filter: blur(10px);
            }

            .card h2 {
                font-size: 1.4rem;
                margin-bottom: 20px;
                color: #00d2ff;
            }

            /* ── Form Grid ── */
            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
            }

            .form-group label {
                font-size: 0.85rem;
                color: #bbb;
                margin-bottom: 5px;
            }

            .form-group input,
            .form-group select {
                padding: 10px 14px;
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                background: rgba(255, 255, 255, 0.08);
                color: #fff;
                font-size: 1rem;
                outline: none;
                transition: border 0.3s;
            }

            .form-group input:focus,
            .form-group select:focus {
                border-color: #00d2ff;
            }

            .form-group select option {
                background: #1a1a2e;
                color: #fff;
            }

            /* ── Buttons ── */
            .btn-row {
                display: flex;
                gap: 15px;
                margin-top: 25px;
            }

            .btn {
                flex: 1;
                padding: 14px;
                border: none;
                border-radius: 10px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition:
                    transform 0.2s,
                    opacity 0.2s;
            }

            .btn:hover {
                transform: translateY(-2px);
                opacity: 0.9;
            }

            .btn-predict {
                background: linear-gradient(90deg, #00d2ff, #3a7bd5);
                color: #fff;
            }

            .btn-example {
                background: rgba(255, 255, 255, 0.1);
                color: #00d2ff;
                border: 1px solid #00d2ff;
            }

            .btn-clear {
                background: rgba(255, 255, 255, 0.1);
                color: #ff6b6b;
                border: 1px solid #ff6b6b;
            }

            /* ── Result ── */
            .result-container {
                display: none;
            }

            .result-grid {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 15px;
            }

            .result-box {
                text-align: center;
                padding: 20px;
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .result-box .label {
                font-size: 0.85rem;
                color: #aaa;
                margin-bottom: 8px;
            }

            .result-box .value {
                font-size: 1.8rem;
                font-weight: 700;
            }

            .high-risk {
                color: #ff6b6b;
            }
            .medium-risk {
                color: #ffa502;
            }
            .low-risk {
                color: #2ed573;
            }

            /* ── Loading ── */
            .loading {
                display: none;
                text-align: center;
                padding: 20px;
                color: #00d2ff;
                font-size: 1.1rem;
            }

            .spinner {
                display: inline-block;
                width: 24px;
                height: 24px;
                border: 3px solid rgba(0, 210, 255, 0.3);
                border-top: 3px solid #00d2ff;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin-right: 10px;
                vertical-align: middle;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* ── Metrics ── */
            .metrics-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }

            .metric-box {
                text-align: center;
                padding: 15px;
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.05);
            }

            .metric-box .metric-value {
                font-size: 1.5rem;
                font-weight: 700;
                color: #00d2ff;
            }

            .metric-box .metric-label {
                font-size: 0.8rem;
                color: #aaa;
                margin-top: 5px;
            }

            /* ── Responsive ── */
            @media (max-width: 600px) {
                .form-grid {
                    grid-template-columns: 1fr;
                }
                .result-grid {
                    grid-template-columns: 1fr;
                }
                .metrics-grid {
                    grid-template-columns: 1fr 1fr;
                }
                .btn-row {
                    flex-direction: column;
                }
                .header h1 {
                    font-size: 1.8rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <!-- ── Header ── -->
            <div class="header">
                <h1>🔮 Customer Churn Predictor</h1>
                <p>
                    Predict whether a customer will leave using Machine Learning
                </p>
            </div>

            <!-- ── Prediction Form ── -->
            <div class="card">
                <h2>📋 Customer Details</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="Age" placeholder="e.g. 45" />
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select id="Gender">
                            <option value="" disabled selected>Select</option>
                            <option value="0">Female</option>
                            <option value="1">Male</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tenure (months)</label>
                        <input
                            type="number"
                            id="Tenure"
                            placeholder="e.g. 24"
                        />
                    </div>

                    <div class="form-group">
                        <label>Usage Frequency</label>
                        <input
                            type="number"
                            id="Usage_Frequency"
                            placeholder="e.g. 8"
                        />
                    </div>

                    <div class="form-group">
                        <label>Support Calls</label>
                        <input
                            type="number"
                            id="Support_Calls"
                            placeholder="e.g. 3"
                        />
                    </div>

                    <div class="form-group">
                        <label>Payment Delay (days)</label>
                        <input
                            type="number"
                            id="Payment_Delay"
                            placeholder="e.g. 10"
                        />
                    </div>

                    <div class="form-group">
                        <label>Subscription Type</label>
                        <select id="Subscription_Type">
                            <option value="" disabled selected>Select</option>
                            <option value="0">Basic</option>
                            <option value="1">Premium</option>
                            <option value="2">Standard</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Contract Length</label>
                        <select id="Contract_Length">
                            <option value="" disabled selected>Select</option>
                            <option value="0">Annual</option>
                            <option value="1">Monthly</option>
                            <option value="2">Quarterly</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Total Spend ($)</label>
                        <input
                            type="number"
                            id="Total_Spend"
                            placeholder="e.g. 500"
                        />
                    </div>

                    <div class="form-group">
                        <label>Last Interaction (days)</label>
                        <input
                            type="number"
                            id="Last_Interaction"
                            placeholder="e.g. 5"
                        />
                    </div>
                </div>

                <!-- ── Buttons ── -->
                <div class="btn-row">
                    <button class="btn btn-predict" onclick="predict()">
                        🔍 Predict
                    </button>
                    <button class="btn btn-example" onclick="loadExample()">
                        📝 Load Example
                    </button>
                    <button class="btn btn-clear" onclick="clearForm()">
                        🗑️ Clear
                    </button>
                </div>
            </div>

            <!-- ── Loading ── -->
            <div class="loading" id="loading">
                <span class="spinner"></span> Analyzing customer data...
            </div>

            <!-- ── Result ── -->
            <div class="card result-container" id="resultCard">
                <h2>📊 Prediction Result</h2>

                <div class="result-grid">
                    <div class="result-box">
                        <div class="label">Prediction</div>
                        <div class="value" id="resultPrediction">—</div>
                    </div>
                    <div class="result-box">
                        <div class="label">Churn Probability</div>
                        <div class="value" id="resultProbability">—</div>
                    </div>
                    <div class="result-box">
                        <div class="label">Risk Level</div>
                        <div class="value" id="resultRisk">—</div>
                    </div>
                </div>
            </div>

            <!-- ── Model Metrics ── -->
            <div class="card">
                <h2>⚙️ Model Performance</h2>
                <div class="metrics-grid" id="metricsGrid">
                    <div class="metric-box">
                        <div class="metric-value" id="metricAccuracy">—</div>
                        <div class="metric-label">Accuracy</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value" id="metricAUC">—</div>
                        <div class="metric-label">AUC Score</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value" id="metricF1">—</div>
                        <div class="metric-label">F1 Score</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-value" id="metricModel">—</div>
                        <div class="metric-label">Model</div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // ── Load Example — fills form with sample data ──
            function loadExample() {
                document.getElementById("Age").value = Math.floor(Math.random() * 53) + 18;
                document.getElementById("Gender").value = Math.floor(Math.random() * 2);
                document.getElementById("Tenure").value = Math.floor(Math.random() * 60) + 1;
                document.getElementById("Usage_Frequency").value = Math.floor(Math.random() * 20) + 1;
                document.getElementById("Support_Calls").value = Math.floor(Math.random() * 11);
                document.getElementById("Payment_Delay").value = Math.floor(Math.random() * 46);
                document.getElementById("Subscription_Type").value = Math.floor(Math.random() * 3);
                document.getElementById("Contract_Length").value = Math.floor(Math.random() * 3);
                document.getElementById("Total_Spend").value = Math.floor(Math.random() * 2901) + 100;
                document.getElementById("Last_Interaction").value = Math.floor(Math.random() * 30) + 1;
            }

            // ── Clear Form ──
            function clearForm() {
                const inputs = document.querySelectorAll("input");
                inputs.forEach((input) => (input.value = ""));

                const selects = document.querySelectorAll("select");
                selects.forEach((select) => (select.selectedIndex = 0));

                document.getElementById("resultCard").style.display = "none";
            }

            // ── Predict ──
            async function predict() {
                // Collect values
                const fields = [
                    "Age",
                    "Gender",
                    "Tenure",
                    "Usage_Frequency",
                    "Support_Calls",
                    "Payment_Delay",
                    "Subscription_Type",
                    "Contract_Length",
                    "Total_Spend",
                    "Last_Interaction",
                ];

                const data = {};
                for (const field of fields) {
                    const el = document.getElementById(field);
                    const val = el.value;

                    if (val === "" || val === null) {
                        alert(
                            "Please fill all fields! Missing: " +
                                field.replace(/_/g, " "),
                        );
                        return;
                    }
                    data[field] = parseFloat(val);
                }

                // Show loading
                document.getElementById("loading").style.display = "block";
                document.getElementById("resultCard").style.display = "none";

                try {
                    const response = await fetch("/predict", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data),
                    });

                    const result = await response.json();

                    // Hide loading
                    document.getElementById("loading").style.display = "none";

                    // Show result
                    document.getElementById("resultCard").style.display =
                        "block";

                    // Prediction text
                    document.getElementById("resultPrediction").textContent =
                        result.churn === 1 ? "Will Churn ❌" : "Will Stay ✅";
                    document.getElementById("resultPrediction").className =
                        "value " +
                        (result.churn === 1 ? "high-risk" : "low-risk");

                    // Probability
                    document.getElementById("resultProbability").textContent =
                        result.probability + "%";
                    document.getElementById("resultProbability").className =
                        "value " + getRiskClass(result.risk);

                    // Risk level
                    document.getElementById("resultRisk").textContent =
                        result.risk;
                    document.getElementById("resultRisk").className =
                        "value " + getRiskClass(result.risk);
                } catch (error) {
                    document.getElementById("loading").style.display = "none";
                    alert("Error: " + error.message);
                }
            }

            // ── Risk class helper ──
            function getRiskClass(risk) {
                if (risk === "High Risk") return "high-risk";
                if (risk === "Medium Risk") return "medium-risk";
                return "low-risk";
            }

            // ── Load Metrics on page load ──
            async function loadMetrics() {
                try {
                    const response = await fetch("/metrics");
                    const data = await response.json();

                    document.getElementById("metricAccuracy").textContent = (data.accuracy * 100).toFixed(2) + "%";
                    document.getElementById("metricAUC").textContent =
                        data.auc_score;
                    document.getElementById("metricF1").textContent =
                        data.f1_churned;
                    document.getElementById("metricModel").textContent =
                        data.model;
                } catch (error) {
                    console.log("Could not load metrics");
                }
            }

            // Load metrics when page opens
            loadMetrics();
        </script>
    </body>
</html>
